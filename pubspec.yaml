name: timizar
description: Melos workspace for Timizar Algerian ride-hailing monorepo
environment:
  sdk: '>=3.5.0 <4.0.0'

workspace:
  - apps/timizar_app
  - apps/timizar_driver
  - packages/timizar_core

dev_dependencies:
  melos: ^8.10.1

melos:
  command:
    bootstrap:
      usePubspecOverrides: true
  scripts:
    test:all:
      run: dart pub global run melos exec --dir-exists="test" -- "flutter test"
      description: Run all tests in all workspace packages
    lint:all:
      run: dart pub global run melos exec -- "flutter analyze"
      description: Run flutter analyze across all workspace packages
