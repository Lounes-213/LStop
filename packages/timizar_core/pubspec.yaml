version: 1.0.0
publish_to: 'none'
resolution: workspace

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dio: ^5.4.3+1
  web_socket_channel: ^3.0.1
  google_sign_in: ^6.2.1
  flutter_secure_storage: ^9.2.2
  intl: ^0.20.2
  maplibre_gl: ^0.16.0
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
